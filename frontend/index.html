<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vienna U-Bahn Navigator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header>
  <span>🚇</span>
  <h1>Vienna U-Bahn Navigator</h1>
  <a href="/admin.html">⚙️ Admin</a>
</header>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="sidebar-section">
      <h2>Plan Route</h2>

      <label for="sel-start">Start</label>
      <select id="sel-start"><option value="">Loading stations…</option></select>
      <div class="pick-row">
        <button id="btn-pick-start" class="btn btn-ghost btn-full">📍 Pick on map</button>
      </div>

      <label for="sel-end">Destination</label>
      <select id="sel-end"><option value="">Loading stations…</option></select>
      <div class="pick-row">
        <button id="btn-pick-end" class="btn btn-ghost btn-full">📍 Pick on map</button>
      </div>

      <div class="action-row">
        <button id="btn-find"  class="btn btn-primary btn-full">🔍 Find Route</button>
        <button id="btn-reset" class="btn btn-secondary">✕ Reset</button>
      </div>
    </div>

    <div class="sidebar-section">
      <h2>Itinerary</h2>
      <div id="result-banner"></div>
      <ul id="result-steps"></ul>
    </div>

  </aside>

  <!-- Map -->
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/config.js"></script>
<script src="/js/map.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pathfinding.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', initMap);
</script>
</body>
</html>
